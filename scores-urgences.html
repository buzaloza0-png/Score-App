:root{
  --bg:#F3F6F8;--surface:#FFFFFF;--surface-2:#EBF0F3;--ink:#16212A;--muted:#5A6772;--line:#E0E6EA;
  --accent:#0E7C86;--accent-ink:#FFFFFF;--accent-soft:#DDF0F1;--focus:#0E7C86;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 6px rgba(16,24,40,.06);
  --mon-bg:#10303A;--mon-ink:#F1FAFB;--mon-muted:#A9C4C9;
  --ok:#1C7A4D;--ok-soft:#E2F4E9;--watch:#8A5800;--watch-soft:#FFF1D2;--high:#BE3F0B;--high-soft:#FFE6D8;
  --crit:#B2222A;--crit-soft:#FDE1E2;--info:#454C6E;--info-soft:#ECEEF6;--pend:#66737D;--pend-soft:#EEF2F4;
  --ok-b:#5FE3A0;--watch-b:#FFCB52;--high-b:#FF9559;--crit-b:#FF6E6E;--info-b:#C7CBEA;--pend-b:#9DB2B8;
  --t1:#0E9AA5;--t2:#2F6FDB;--t3:#2E8B57;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1418;--surface:#162026;--surface-2:#1C2830;--ink:#E7EEF1;--muted:#9DAFB8;--line:#25343C;
    --accent:#4FC3CB;--accent-ink:#04262A;--accent-soft:#143A3E;--focus:#4FC3CB;--shadow:none;
    --mon-bg:#071114;
    --ok:#6EE0A2;--ok-soft:#11301F;--watch:#FFCF5C;--watch-soft:#33280D;--high:#FF9A61;--high-soft:#3A1F13;
    --crit:#FF7B7B;--crit-soft:#3D1619;--info:#C5C9E6;--info-soft:#22254A;--pend:#9DAFB8;--pend-soft:#1C2830;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1418;--surface:#162026;--surface-2:#1C2830;--ink:#E7EEF1;--muted:#9DAFB8;--line:#25343C;
  --accent:#4FC3CB;--accent-ink:#04262A;--accent-soft:#143A3E;--focus:#4FC3CB;--shadow:none;
  --mon-bg:#071114;
  --ok:#6EE0A2;--ok-soft:#11301F;--watch:#FFCF5C;--watch-soft:#33280D;--high:#FF9A61;--high-soft:#3A1F13;
  --crit:#FF7B7B;--crit-soft:#3D1619;--info:#C5C9E6;--info-soft:#22254A;--pend:#9DAFB8;--pend-soft:#1C2830;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.large body{zoom:1.12}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"AHN",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:22px;height:22px;flex:none}

/* ---------- Structure ---------- */
.shell{max-width:680px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-bottom:92px}
body.calc-mode .shell{padding-bottom:0}
.appbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:6px;min-height:64px;padding:8px 10px 8px 16px;background:var(--bg)}
body.calc-mode .appbar,.appbar.solid{background:var(--surface);border-bottom:1px solid var(--line);padding-left:6px}
.appbar h1{font-size:22px;line-height:1.2;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em;outline:none}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand .ecg{width:40px;height:20px;color:var(--accent);flex:none}
.icon-btn{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink);cursor:pointer}
.icon-btn:hover{background:var(--surface-2)}
.text-btn{flex:none;border:0;background:none;color:var(--accent);font-weight:700;min-height:44px;padding:0 10px;cursor:pointer;border-radius:10px}
.view{padding:4px 16px 24px}
body.calc-mode .view{padding-top:14px;padding-bottom:0}

.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar-in{display:grid;grid-template-columns:repeat(5,1fr);max-width:680px;margin:0 auto}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 10px;color:var(--muted);font-size:12.5px;cursor:pointer;min-width:0}
.tab .pill{width:58px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .15s}
.tab span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}
.tab[aria-current="page"] .pill{background:var(--accent-soft)}
body.calc-mode .tabbar{display:none}

/* ---------- Accueil ---------- */
.search{position:relative;margin:6px 0 4px}
.search input{width:100%;height:56px;border-radius:18px;border:1px solid transparent;background:var(--surface-2);padding:0 16px 0 52px;font-size:17px;-webkit-appearance:none;appearance:none}
.search input:focus{border-color:var(--accent);background:var(--surface)}
.search input::placeholder{color:var(--muted)}
.search .ic{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--accent);pointer-events:none}
.h2{font-size:22px;color:var(--accent);font-weight:700;margin:26px 2px 12px;letter-spacing:-.01em}
.hint{color:var(--muted);margin:0 2px;font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{border:0;border-radius:20px;min-height:118px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;color:var(--ink);font-size:16px;font-weight:700;line-height:1.2;text-align:center;background:color-mix(in srgb,var(--c) 15%,var(--surface))}
.tile .ic{width:32px;height:32px;color:var(--c)}
.foot{font-size:13px;color:var(--muted);margin:28px 2px 0}

/* ---------- Lignes de score ---------- */
.rows{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.row{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.row-link{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:12px 4px 12px 12px;background:none;border:0;text-align:left;cursor:pointer;border-radius:18px 0 0 18px}
.av{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:19px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,var(--surface))}
.row-t{min-width:0;flex:1}
.row-name{display:block;font-weight:700;font-size:17px;line-height:1.3}
.row-sub{display:flex;align-items:baseline;gap:7px;color:var(--muted);font-size:14px;line-height:1.35;margin-top:2px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);flex:none;transform:translateY(-1px)}
.heart{flex:none;width:44px;height:44px;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:var(--muted);cursor:pointer}
.heart[aria-pressed="true"]{color:var(--accent)}
.chev{flex:none;align-self:stretch;width:36px;border:0;background:none;display:grid;place-items:center;color:var(--muted);cursor:pointer;border-radius:0 18px 18px 0}
.chev .ic{width:18px;height:18px}
.grp{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--muted);margin:22px 4px 10px}

/* ---------- Catégories ---------- */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.ccard{border:1px solid var(--line);background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:22px 10px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;text-align:center}
.ccard .bubble{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 15%,var(--surface));margin-bottom:6px}
.ccard .bubble .ic{width:30px;height:30px}
.ccard b{font-size:18px;line-height:1.25}
.ccard span{color:var(--muted);font-size:15px}

/* ---------- États vides, cartes ---------- */
.empty{text-align:center;padding:16vh 16px 0;color:var(--muted)}
.empty .ic{width:76px;height:76px;color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.empty h2{color:var(--ink);font-size:24px;margin:20px 0 8px}
.empty p{margin:0 auto;max-width:30em;font-size:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:6px 16px;margin-top:14px}
.card h2{font-size:15px;color:var(--accent);margin:12px 0 4px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.card h2+.set-row{border-top:0}
.set-row>span{font-weight:700}
.set-note,.about{color:var(--muted);font-size:14px;margin:6px 0 12px}
.seg2{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px}
.seg2 button{border:0;background:none;border-radius:9px;min-height:38px;padding:0 12px;cursor:pointer;color:var(--muted);font-weight:700;font-size:14px}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px 8px 14px 16px;margin-top:12px}
.hhead{display:flex;align-items:center;gap:12px}
.hhead .av{width:40px;height:40px;font-size:16px}
.hhead div{flex:1;min-width:0}
.hhead b{display:block;font-size:17px}
.hdate{color:var(--muted);font-size:13px}
.hres{margin:10px 8px 0 0;font-weight:700;color:var(--lv)}
.htext{margin:4px 8px 0 0;font-size:15px}
.hin{margin:6px 8px 0 0;font-size:13.5px;color:var(--muted)}
.hopen{border:0;background:none;color:var(--accent);font-weight:700;padding:8px 0 0;cursor:pointer}

/* ---------- Calculateur ---------- */
.intro{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px}
.chip{display:inline-flex;align-items:center;gap:7px;margin:0;font-size:14px;font-weight:700;color:var(--c)}
.intro-full{margin:6px 0 0;font-size:17px;font-weight:700;line-height:1.35}
.intro-when{margin:8px 0 0;font-size:15px;color:var(--muted)}
.intro-when b{color:var(--ink)}
.sec{font-size:16px;font-weight:700;color:var(--accent);margin:24px 4px 0}
.item{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-top:12px}
.item-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-weight:700;font-size:17px;line-height:1.35;color:var(--accent)}
.item-head label{flex:1}
.pts{flex:none;min-width:2.4em;text-align:center;font-size:14px;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums}
.pts.on{background:var(--accent);color:var(--accent-ink)}
.help{margin:4px 0 0;color:var(--muted);font-size:14px;line-height:1.45}
.opts{display:grid;gap:2px;margin-top:8px}
.item>.opts:first-child{margin-top:-4px;margin-bottom:-4px}
.opt{position:relative;display:flex;align-items:center;gap:14px;min-height:50px;padding:9px 10px;border-radius:12px;cursor:pointer;line-height:1.35}
.opt input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.mark{flex:none;width:24px;height:24px;border:2px solid var(--muted);border-radius:50%;display:grid;place-items:center;background:var(--surface)}
.check .mark{border-radius:7px}
.opt.sel{background:var(--accent-soft)}
.opt.sel .mark{border-color:var(--accent);background:var(--accent)}
.opt.sel .mark::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent-ink)}
.check.sel .mark::after{width:6px;height:11px;border-radius:0;background:none;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.opt:focus-within{outline:3px solid var(--focus);outline-offset:1px}
.opt:has(input:focus:not(:focus-visible)){outline:none}
.opt-l{flex:1;min-width:0}
.opt-l small{display:block;color:var(--muted);font-size:14px;margin-top:2px;line-height:1.4}
.opt-p{flex:none;font-weight:700;color:var(--muted);font-size:15px;min-width:2.2em;text-align:right;font-variant-numeric:tabular-nums}
.opt.sel .opt-p{color:var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.seg label,.useg label,.scale label{position:relative;cursor:pointer}
.seg input,.useg input,.scale input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.seg span{display:inline-flex;align-items:center;min-height:44px;padding:8px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);line-height:1.3}
.seg input:checked+span,.useg input:checked+span,.scale input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg input:focus-visible+span,.useg input:focus-visible+span,.scale input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.num-row{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.num-row input{width:8em;height:54px;font-size:22px;font-weight:700;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
.num-row input:focus{border-color:var(--accent);background:var(--surface)}
.num-row input.bad{border-color:var(--crit);box-shadow:0 0 0 1px var(--crit)}
.unit{color:var(--muted);font-size:16px}
.useg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.useg span{display:inline-flex;align-items:center;min-height:42px;padding:0 12px;font-size:15px;background:var(--surface);border-left:1px solid var(--line)}
.useg label:first-child span{border-left:0}
.err{color:var(--crit);font-size:14px;margin:6px 0 0}
.adders{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.adder{min-height:40px;padding:6px 12px;border-radius:12px;border:1px dashed var(--muted);background:transparent;cursor:pointer;font-size:14px}
.adder b{color:var(--accent)}
.adder.clear{border-style:solid;border-color:var(--line);color:var(--muted)}
.scale{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px;margin-top:10px;max-width:440px}
.scale span{display:grid;place-items:center;height:46px;border:1px solid var(--line);border-radius:12px;font-weight:700;background:var(--surface);font-variant-numeric:tabular-nums}
.anchors{margin:10px 0 0;display:grid;gap:3px;font-size:14px;color:var(--muted);line-height:1.4}
.anchors div{display:flex;gap:10px}
.anchors dt{font-weight:700;min-width:1.1em}
.anchors dd{margin:0}
.anchors .cur{color:var(--ink)}
.anchors .cur dd{font-weight:700}

/* ---------- Résultat ---------- */
.lvl-ok{--lv:var(--ok);--lv-soft:var(--ok-soft);--lv-b:var(--ok-b)}
.lvl-watch{--lv:var(--watch);--lv-soft:var(--watch-soft);--lv-b:var(--watch-b)}
.lvl-high{--lv:var(--high);--lv-soft:var(--high-soft);--lv-b:var(--high-b)}
.lvl-crit{--lv:var(--crit);--lv-soft:var(--crit-soft);--lv-b:var(--crit-b)}
.lvl-info{--lv:var(--info);--lv-soft:var(--info-soft);--lv-b:var(--info-b)}
.lvl-pending{--lv:var(--pend);--lv-soft:var(--pend-soft);--lv-b:var(--pend-b)}
.result{margin:22px 0 0;border-radius:20px;padding:18px 18px 16px;background:var(--lv-soft);border:1px solid var(--line);border-left:8px solid var(--lv);scroll-margin:84px}
.res-top{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap}
.res-val{margin:0;font-size:50px;font-weight:700;line-height:1;color:var(--lv);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.res-unit{font-size:18px;color:var(--muted);font-weight:700;margin-left:6px;letter-spacing:0}
.res-pre{font-size:22px;color:var(--muted);font-weight:700;margin-right:8px;letter-spacing:0}
.res-title{margin:0;font-size:21px;font-weight:700;color:var(--lv);line-height:1.25;flex:1 1 12em}
.res-title:focus{outline:none}
.res-warn{margin:12px 0 0;padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--crit);color:var(--crit);font-weight:700;font-size:15px}
.res-text{margin:10px 0 0;font-size:16px}
.res-lines{margin:10px 0 0;padding-left:20px;font-size:15px}
.res-lines li{margin-top:4px}
.res-confirm{margin:14px 0 0}
.res-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.res-actions .btn{padding:0 4px;font-size:15px}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
details{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px 16px 8px}
summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center;font-size:17px;color:var(--accent)}
details ul,details ol{margin:4px 0 6px;padding-left:20px}
details li{margin:6px 0}
.refs li{font-size:14px;color:var(--muted)}
.disclaimer{font-size:13px;color:var(--muted);margin:20px 4px 0;padding-bottom:16px}

/* ---------- Bandeau résultat (moniteur) ---------- */
.monitor{position:sticky;bottom:0;z-index:4;margin:8px -16px 0;background:var(--mon-bg);color:var(--mon-ink);padding-bottom:env(safe-area-inset-bottom);transition:transform .2s ease,opacity .2s ease}
.monitor.off{transform:translateY(100%);opacity:0;pointer-events:none}
.mon-btn{display:flex;align-items:center;gap:14px;width:100%;padding:10px 16px;border:0;background:transparent;color:inherit;text-align:left;cursor:pointer}
.mon-bar{width:6px;align-self:stretch;border-radius:3px;background:var(--lv-b);flex:none}
.mon-l{flex:1;min-width:0}
.mon-name{display:block;font-size:13px;color:var(--mon-muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mon-title{font-size:17px;font-weight:700;color:var(--lv-b);line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mon-v{flex:none;font-size:38px;font-weight:700;line-height:1;color:var(--lv-b);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mon-v small{font-size:15px;color:var(--mon-muted);margin-left:4px;letter-spacing:0}
.mon-v small.pre{margin:0 6px 0 0}

.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(10px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:15px;z-index:30;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center}
body.calc-mode .toast{bottom:96px}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){.monitor,.toast,.tab .pill{transition:none}}
@media print{.tabbar,.monitor,.res-actions,.appbar .icon-btn{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<noscript><p style="padding:16px">Activez JavaScript pour utiliser les calculateurs.</p></noscript>
<div class="shell">
  <header class="appbar" id="appbar"></header>
  <main class="view" id="view"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Navigation principale"><div class="tabbar-in" id="tabs"></div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<p id="live" class="sr" aria-live="polite"></p>

<script>
'use strict';
(() => {
/* ================================================================
   Outils
   ================================================================ */
const CATS = [
  { id: 'triage', l: 'Triage', s: 'Triage' },
  { id: 'grav', l: 'Gravité et sepsis', s: 'Gravité' },
  { id: 'neuro', l: 'Neurologie', s: 'Neuro' },
  { id: 'cardio', l: 'Cardiologie', s: 'Cardio' },
  { id: 'mte', l: 'Thrombose et embolie pulmonaire', s: 'Thrombose' },
  { id: 'resp', l: 'Pneumologie et ORL', s: 'Pneumo-ORL' },
  { id: 'dig', l: 'Digestif', s: 'Digestif' },
  { id: 'trauma', l: 'Traumatologie', s: 'Trauma' },
  { id: 'brul', l: 'Brûlures', s: 'Brûlures' },
  { id: 'tox', l: 'Addictologie', s: 'Addicto' },
  { id: 'obst', l: 'Obstétrique', s: 'Obstétrique' },
  { id: 'ped', l: 'Pédiatrie et naissance', s: 'Pédiatrie' },
  { id: 'onco', l: 'Oncologie', s: 'Oncologie' },
  { id: 'dlr', l: 'Douleur et sédation', s: 'Douleur' },
  { id: 'anesth', l: 'Anesthésie', s: 'Anesthésie' },
  { id: 'sap', l: 'Pousse-seringues (SAP)', s: 'SAP' },
];
const fmt = (x, d = 0) => {
  if (x == null || !Number.isFinite(x)) return '—';
  const r = Math.round(x * 10 ** d) / 10 ** d;
  return r.toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d }).replace('-', '−');
};
const fmtS = x => fmt(x, Number.isInteger(x) ? 0 : 1);
const fmtP = p => (p > 0 ? '+' : '') + fmtS(p);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/* espaces insécables devant : ; ? ! % (typographie française) */
const t = s => esc(s).replace(/ ([:;?!%])/g, ' $1');
const norm = s => s.normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase();
const plural = (n, a, b) => n > 1 ? b : a;

/* ================================================================
   Définition des scores
   Types d’éléments :
   h (titre de section) · radio · seg (choix compact) · check · num · scale
   ================================================================ */
const S = [];

/* ---------------- Gravité et sepsis ---------------- */
function news2Spo2(x, v) {
  if (v.echelle !== 1) return x <= 91 ? 3 : x <= 93 ? 2 : x <= 95 ? 1 : 0;
  if (x <= 83) return 3;
  if (x <= 85) return 2;
  if (x <= 87) return 1;
  if (x <= 92) return 0;
  if (v.o2 == null) return null;
  if (v.o2 === 0) return 0;
  return x <= 94 ? 1 : x <= 96 ? 2 : 3;
}
S.push({
  id: 'news2', cat: 'grav', name: 'NEWS2', full: 'National Early Warning Score 2',
  desc: 'Dépister la dégradation clinique de l’adulte',
  tags: 'surveillance alerte constantes sepsis deterioration early warning score',
  when: 'Adulte (16 ans et plus) hors grossesse, à l’admission puis à chaque prise de constantes.',
  max: 20,
  items: [
    { t: 'seg', id: 'echelle', l: 'Échelle de SpO₂', def: 0, o: [{ l: 'Échelle 1' }, { l: 'Échelle 2 (hypercapnie)' }],
      h: 'Échelle 2 uniquement sur prescription médicale : insuffisance respiratoire hypercapnique avec SpO₂ cible de 88 à 92 %.' },
    { t: 'num', id: 'fr', l: 'Fréquence respiratoire', u: '/min', min: 0, max: 80,
      pf: x => x <= 8 ? 3 : x <= 11 ? 1 : x <= 20 ? 0 : x <= 24 ? 2 : 3 },
    { t: 'num', id: 'spo2', l: 'SpO₂', u: '%', min: 40, max: 100, pf: news2Spo2 },
    { t: 'seg', id: 'o2', l: 'Air ou oxygène', o: [{ l: 'Air ambiant', p: 0 }, { l: 'Oxygénothérapie', p: 2 }] },
    { t: 'num', id: 'pas', l: 'Pression artérielle systolique', u: 'mmHg', min: 20, max: 300,
      pf: x => x <= 90 ? 3 : x <= 100 ? 2 : x <= 110 ? 1 : x <= 219 ? 0 : 3 },
    { t: 'num', id: 'fc', l: 'Fréquence cardiaque', u: '/min', min: 10, max: 250,
      pf: x => x <= 40 ? 3 : x <= 50 ? 1 : x <= 90 ? 0 : x <= 110 ? 1 : x <= 130 ? 2 : 3 },
    { t: 'radio', id: 'cons', l: 'Conscience (ACVPU)', o: [
      { l: 'Alerte', p: 0 },
      { l: 'Confusion nouvelle, réponse à la voix, à la douleur, ou aucune réponse', p: 3 }] },
    { t: 'num', id: 'temp', l: 'Température', u: '°C', min: 25, max: 45,
      pf: x => x <= 35 ? 3 : x <= 36 ? 1 : x <= 38 ? 0 : x <= 39 ? 1 : 2 },
  ],
  interp(tot, v, c) {
    const red = Object.keys(c.pts).filter(k => c.pts[k] === 3).map(c.label);
    if (tot >= 7) return { lvl: 'crit', title: 'Risque clinique élevé', text: 'Seuil de réponse d’urgence : évaluation immédiate par une équipe compétente en soins critiques, surveillance continue des constantes.' };
    if (tot >= 5) return { lvl: 'high', title: 'Risque clinique moyen', text: 'Seuil de réponse urgente : évaluation médicale urgente, constantes au minimum toutes les heures.' };
    if (red.length) return { lvl: 'watch', title: 'Risque faible à moyen', text: `Paramètre coté 3 (${red.join(', ')}) : informer le médecin pour une évaluation urgente, constantes au minimum toutes les heures.` };
    if (tot >= 1) return { lvl: 'ok', title: 'Risque clinique faible', text: 'Évaluation par un infirmier qualifié, constantes au minimum toutes les 4 à 6 heures (à adapter au protocole du service).' };
    return { lvl: 'ok', title: 'Risque clinique faible', text: 'Surveillance habituelle (au minimum toutes les 12 heures selon le NEWS2, à adapter au service).' };
  },
  notes: [
    'Non validé chez l’enfant ni pendant la grossesse.',
    'Une inquiétude soignante justifie une escalade quel que soit le score.',
    'La Surviving Sepsis Campaign 2021 déconseille le qSOFA comme outil unique de dépistage du sepsis, comparativement au SIRS, au NEWS ou au MEWS.',
  ],
  refs: [
    'Royal College of Physicians. National Early Warning Score (NEWS) 2: standardising the assessment of acute-illness severity in the NHS. Londres, RCP, 2017.',
    'Evans L et al. Surviving Sepsis Campaign: international guidelines for management of sepsis and septic shock 2021. Intensive Care Med 2021;47:1181-247.',
  ],
});

S.push({
  id: 'qsofa', cat: 'grav', name: 'qSOFA', full: 'quick Sequential Organ Failure Assessment',
  desc: 'Patient infecté : risque de mauvaise évolution',
  tags: 'sepsis infection sofa sepsis-3 choc septique',
  when: 'Adulte avec infection suspectée ou confirmée, hors réanimation.',
  max: 3,
  items: [
    { t: 'check', id: 'fr', l: 'Fréquence respiratoire ≥ 22/min', p: 1 },
    { t: 'check', id: 'cons', l: 'Altération de la conscience (GCS < 15)', p: 1 },
    { t: 'check', id: 'pas', l: 'Pression artérielle systolique ≤ 100 mmHg', p: 1 },
  ],
  interp(tot) {
    if (tot >= 2) return { lvl: 'high', title: 'qSOFA positif', text: 'Risque accru de décès et de séjour prolongé en réanimation : rechercher une dysfonction d’organe (lactates, SOFA) et traiter le sepsis sans délai.' };
    return { lvl: 'info', title: 'qSOFA négatif', text: 'N’exclut pas un sepsis : le qSOFA est peu sensible. Poursuivre l’évaluation (NEWS2, lactates, examen clinique).' };
  },
  notes: [
    'La Surviving Sepsis Campaign 2021 recommande de ne pas utiliser le qSOFA comme outil unique de dépistage du sepsis.',
    'Le qSOFA est un outil pronostique (Sepsis-3), pas un critère diagnostique.',
    'Le dosage des lactates est suggéré en cas de suspicion de sepsis.',
  ],
  refs: [
    'Singer M et al. The Third International Consensus Definitions for Sepsis and Septic Shock (Sepsis-3). JAMA 2016;315:801-10.',
    'Seymour CW et al. Assessment of clinical criteria for sepsis. JAMA 2016;315:762-74.',
    'Evans L et al. Surviving Sepsis Campaign 2021. Intensive Care Med 2021;47:1181-247.',
  ],
});

S.push({
  id: 'si', cat: 'grav', name: 'Indice de choc', full: 'Shock index : FC / PAS',
  desc: 'Hypoperfusion masquée : hémorragie, sepsis',
  tags: 'shock index choc hemorragie trauma transfusion hypovolemie',
  when: 'Adulte, en complément des constantes : traumatisé, hémorragie, sepsis.',
  items: [
    { t: 'num', id: 'fc', l: 'Fréquence cardiaque', u: '/min', min: 10, max: 250 },
    { t: 'num', id: 'pas', l: 'Pression artérielle systolique', u: 'mmHg', min: 20, max: 300 },
  ],
  calc(v, c) {
    const p = c.need(['fc', 'pas']); if (p) return p;
    const si = v.fc / v.pas;

  tags: 'sdra ards detresse respiratoire aigue berlin pao2 fio2 rapport p/f ventilation',
  when: 'Insuffisance respiratoire aiguë hypoxémique sous PEP ou CPAP ≥ 5 cmH₂O.',
  hidePts: true,
  items: [
    { t: 'h', l: 'Critères (tous nécessaires)' },
    { t: 'check', id: 'delai', l: 'Début dans la semaine suivant une agression connue, ou aggravation respiratoire récente', p: 1 },
    { t: 'check', id: 'img', l: 'Opacités bilatérales à l’imagerie, non expliquées par des épanchements, une atélectasie ou des nodules', p: 1 },
    { t: 'check', id: 'orig', l: 'Œdème non expliqué entièrement par une insuffisance cardiaque ou une surcharge', h: 'Sans facteur de risque identifié, une évaluation objective (échocardiographie) est nécessaire.', p: 1 },
    { t: 'h', l: 'Ventilation et oxygénation' },
    { t: 'seg', id: 'sup', l: 'Support ventilatoire', o: [{ l: 'Ventilation invasive, PEP ≥ 5 cmH₂O' }, { l: 'VNI ou CPAP ≥ 5 cmH₂O' }, { l: 'Autre (PEP < 5, oxygène seul)' }] },
    { t: 'num', id: 'pao2', l: 'PaO₂', units: [{ u: 'mmHg', f: 1 }, { u: 'kPa', f: 7.50062 }], min: 10, max: 700 },

  calc(v, c) {
    const p = c.need(['sup', 'pao2', 'fio2']); if (p) return p;

    const miss = ['delai', 'img', 'orig'].filter(k => !v[k]).map(c.label);
    if (v.sup === 2) miss.push('PEP ou CPAP ≥ 5 cmH₂O');
    const r = { value: fmt(pf), unit: 'P/F' };
    if (pf > 300) return Object.assign(r, { lvl: 'ok', title: 'Pas de SDRA (P/F > 300)', text: 'Le rapport PaO₂/FiO₂ ne remplit pas le critère d’oxygénation.' });

    return Object.assign(r, { lvl: 'crit', title: 'SDRA sévère', text: 'Rapport PaO₂/FiO₂ ≤ 100 sous PEP ≥ 5 cmH₂O.' });
  },
  notes: ['La définition mondiale de 2023 élargit le diagnostic aux patients non intubés (oxygène nasal à haut débit ≥ 30 L/min ou VNI) et accepte un rapport SpO₂/FiO₂ ≤ 315 si la SpO₂ est ≤ 97 %.'],

  ],
});

  'µg/min': { m: 'µg', kg: false, t: 'min' }, 'µg/h': { m: 'µg', kg: false, t: 'h' },
  'mg/h': { m: 'mg', kg: false, t: 'h' }, 'UI/h': { m: 'UI', kg: false, t: 'h' },
};

const AU_LIST = ['mg', 'µg', 'UI'];

};
const fmtRate = x => fmt(x, x < 10 ? 2 : 1);

function sap(d) {

  if (custom) {
    items.push({ t: 'seg', id: 'au', l: 'Unité de la quantité préparée', def: 0, o: AU_LIST.map(l => ({ l })) });
    items.push({ t: 'seg', id: 'du', l: 'Unité de la dose prescrite', def: 0, o: DU_LIST.map(l => ({ l })) });
  }
  const salt = d.salt; /* 1 unité de sel = salt.f unité de base */

  ],

/* ================================================================
   Moteur de calcul
   ================================================================ */
const byId = Object.fromEntries(S.map(s => [s.id, s]));
const itemOf = (sc, id) => sc.items.find(i => i.id === id);
const labelOf = (sc, id) => { const it = itemOf(sc, id); return it ? it.l : id; };

function itemPoints(it, v) {
  const val = v[it.id];
  switch (it.t) {
    case 'check': return val ? it.p : 0;
    case 'radio': return val == null ? null : it.o[val].p;
    case 'seg':
      if (!it.o.some(o => 'p' in o)) return it.req && val == null ? null : undefined;
      return val == null ? null : it.o[val].p;
    case 'scale': return val == null ? null : val;
    case 'num': if (!it.pf) return undefined; return val == null ? null : it.pf(val, v);
    default: return undefined;
  }
}

function sumCalc(sc, v) {
  let total = 0; const missing = [], pts = {}, nt = [];
  for (const it of sc.items) {
    if (!it.id) continue;
    if (it.show && !it.show(v)) continue;
    const p = itemPoints(it, v);
    if (p === undefined) continue;
    if (p === null) { if (!it.opt) missing.push(it); continue; }
    pts[it.id] = p; total += p;
    if ((it.t === 'radio' || it.t === 'seg') && it.o[v[it.id]].nt) nt.push(it.l.split(' ')[0].replace(/\.$/, ''));
  }
  return { total, missing, pts, nt };
}

function pendingResult(sc, missing, partial) {
  const n = missing.length;
  return {
    pending: true, lvl: 'pending',
    value: partial == null ? '—' : fmtS(partial),
    unit: partial == null || sc.max == null ? '' : '/ ' + fmtS(sc.max),
    title: n === 1 ? '1 élément à renseigner' : `${n} éléments à renseigner`,
    text: partial == null ? '' : 'Score provisoire tant que tous les éléments ne sont pas renseignés.',
    lines: ['À renseigner : ' + missing.map(it => it.l).join(', ')],
  };
}

function ctxFor(sc, v) {
  return {
    label: id => labelOf(sc, id),
    opt: id => { const it = itemOf(sc, id); return v[id] == null ? null : it.o[v[id]]; },
    need: ids => {
      const miss = ids.filter(id => v[id] == null).map(id => itemOf(sc, id));
      return miss.length ? pendingResult(sc, miss, null) : null;
    },
    sum: () => {
      const b = sumCalc(sc, v);
      if (b.missing.length) b.pending = pendingResult(sc, b.missing, b.total);
      return b;
    },
  };
}

function computeResult(sc, v) {
  const c = ctxFor(sc, v);
  if (sc.calc) return sc.calc(v, c);
  const b = sumCalc(sc, v);
  const hasAnswer = sc.items.some(it => it.id && it.t !== 'check' && v[it.id] != null && !(it.t === 'seg' && it.def != null)) || sc.items.some(it => it.t === 'check' && v[it.id]);
  if (b.missing.length) return pendingResult(sc, b.missing, hasAnswer ? b.total : null);
  const r = sc.interp(b.total, v, { pts: b.pts, nt: b.nt, label: c.label });
  if (r.value == null) r.value = fmtS(b.total);
  if (r.unit == null) r.unit = sc.max != null ? '/ ' + fmtS(sc.max) : '';
  return r;
}

const CC = { triage: '#B45309', grav: '#D62839', neuro: '#8E24AA', cardio: '#E11D48', mte: '#1E6FD9', resp: '#0E8A7E', dig: '#2E7D32', trauma: '#52606D', brul: '#D9480F', tox: '#7C5A3A', obst: '#C2185B', ped: '#0891B2', anesth: '#4338CA', sap: '#7C3AED', dlr: '#4D7C0F', onco: '#A16207' };
const initial = n => (n.replace(/^[^A-Za-zÀ-ÿ0-9]+/, '')[0] || '?').toUpperCase();

/* ---------- Barre du haut, onglets, toast ---------- */
const TABS = [['home', 'Accueil', 'home'], ['cats', 'Catégories', 'cats'], ['fav', 'Favoris', 'heart'], ['hist', 'Historique', 'hist'], ['set', 'Paramètres', 'set']];
function renderTabs(active) {
  tabsEl.innerHTML = TABS.map(([r, l, ic]) => `<button type="button" class="tab" data-go="${r}"${active === r ? ' aria-current="page"' : ''}><span class="pill">${svg(ic)}</span><span>${l}</span></button>`).join('');
}
function bar({ title, back = false, right = '', brand = false }) {
  barEl.className = 'appbar' + (back ? ' solid' : '');
  barEl.innerHTML = (back ? `<button type="button" class="icon-btn" data-back aria-label="Retour">${svg('back')}</button>` : '')
    + (brand ? `<div class="brand">${ECG}<h1 tabindex="-1">${t(title)}</h1></div>` : `<h1 tabindex="-1">${t(title)}</h1>`) + right;
}
let toastT = null;
function toast(msg) {
  toastEl.textContent = msg; toastEl.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), 2200);
}

/* ---------- Lignes de score ---------- */
function rowHtml(s, sub = 'cat') {
  const on = favs.includes(s.id);
  const subHtml = sub === 'cat' ? `<i class="dot"></i>${t(catOf(s).l)}` : t(s.desc);
  return `<li class="row" style="--c:${CC[s.cat]}"><button type="button" class="row-link" data-open="${s.id}"><span class="av">${esc(initial(s.name))}</span><span class="row-t"><span class="row-name">${t(s.name)}</span><span class="row-sub">${subHtml}</span></span></button><button type="button" class="heart" data-fav="${s.id}" aria-pressed="${on}" aria-label="${on ? 'Retirer' : 'Ajouter'} ${esc(s.name)} ${on ? 'des' : 'aux'} favoris">${heartSvg(on)}</button><button type="button" class="chev" data-open="${s.id}" tabindex="-1" aria-hidden="true">${svg('chev')}</button></li>`;
}
const rows = (list, sub) => `<ul class="rows">${list.map(s => rowHtml(s, sub)).join('')}</ul>`;
const searchBox = ph => `<div class="search">${svg('search')}<input id="q" type="search" placeholder="${esc(ph)}" aria-label="Rechercher un score" autocomplete="off" spellcheck="false"></div>`;
function matches(q) { const w = norm(q.trim()).split(/\s+/).filter(Boolean); return S.filter(s => w.every(x => searchIndex[s.id].includes(x))); }
function grouped(list, sub) {
  let h = '';
  for (const c of CATS) {
    const items = list.filter(s => s.cat === c.id);
    if (items.length) h += `<h2 class="grp" style="--c:${CC[c.id]}"><i class="dot"></i>${t(c.l)}</h2>${rows(items, sub)}`;
  }
  return h;
}
function noResult(q) { return `<div class="empty" style="padding-top:8vh">${svg('search')}<h2>Aucun résultat</h2><p>Aucun score ne correspond à « ${esc(q)} ».</p></div>`; }

/* ---------- Vues ---------- */

  home() {

      + `<p class="foot">${S.length} scores dans ${CATS.length} catégories. Outil d’aide à la décision à visée pédagogique : il ne remplace ni le jugement clinique ni les protocoles du service.</p></div>`;
    const q = $('#q'), res = $('#results'), main = $('#homeMain');
    q.addEventListener('input', () => {

    });
  },
  all() {

    viewEl.innerHTML = searchBox('Filtrer les scores…') + `<div id="results">${grouped(S, 'desc')}</div>`;

  },
  cats() {

    viewEl.innerHTML = `<div class="cgrid">${CATS.map(c => {
      const n = S.filter(s => s.cat === c.id).length;
      return `<button type="button" class="ccard" style="--c:${CC[c.id]}" data-go="cat/${c.id}"><span class="bubble">${svg(c.id)}</span><b>${t(c.l)}</b><span>${n} ${c.id === 'sap' ? plural(n, 'calculateur', 'calculateurs') : plural(n, 'score', 'scores')}</span></button>`;
    }).join('')}</div>`;
  },
  cat(id) {
    const c = CATS.find(x => x.id === id);
    if (!c) return VIEWS.cats();
    bar({ title: c.l, back: true });

  },
  fav() {
    bar({ title: 'Favoris' });
    const list = favs.map(id => byId[id]).filter(Boolean);
    viewEl.innerHTML = list.length ? rows(list)
      : `<div class="empty">${svg('heart')}<h2>Aucun favori</h2><p>Touchez le cœur d’un score pour l’ajouter à vos favoris.</p></div>`;
  },
  hist() {
    bar({ title: 'Historique', right: hist.length ? '<button type="button" class="text-btn" data-clear="hist">Tout effacer</button>' : '' });
    if (!hist.length) { viewEl.innerHTML = `<div class="empty">${svg('hist')}<h2>Aucun résultat enregistré</h2><p>Dans un score, touchez « Enregistrer » pour retrouver le résultat ici.</p></div>`; return; }
    viewEl.innerHTML = hist.map((h, i) => {
      const s = byId[h.id], d = new Date(h.date);
      const when = `${d.toLocaleDateString('fr-FR')} à ${d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}`;
      return `<article class="hcard lvl-${h.lvl || 'info'}" style="--c:${s ? CC[s.cat] : 'var(--muted)'}"><div class="hhead"><span class="av">${esc(initial(h.name))}</span><div><b>${t(h.name)}</b><span class="hdate">${when}</span></div><button type="button" class="icon-btn" data-del="${i}" aria-label="Supprimer ce résultat">${svg('trash')}</button></div>`
        + `<p class="hres">${t(h.value)}${h.unit ? ' ' + t(h.unit) : ''} : ${t(h.title)}</p>`

    viewEl.innerHTML = `<section class="card"><h2>Apparence</h2>`
      + `<div class="set-row"><span>Thème</span><div class="seg2">${opt('theme', 'auto', 'Système')}${opt('theme', 'light', 'Clair')}${opt('theme', 'dark', 'Sombre')}</div></div>`
      + `<div class="set-row"><span>Taille du texte</span><div class="seg2">${opt('size', 'n', 'Normale')}${opt('size', 'l', 'Grande')}</div></div></section>`
      + `<section class="card"><h2>Données</h2>`
      + `<div class="set-row"><span>Historique (${hist.length})</span><button type="button" class="btn ghost sm" data-clear="hist"${hist.length ? '' : ' disabled'}>Effacer</button></div>`
      + `<div class="set-row"><span>Favoris et récents</span><button type="button" class="btn ghost sm" data-clear="fav"${favs.length || recents.length ? '' : ' disabled'}>Effacer</button></div>`
      + `<p class="set-note">${store.ok ? 'Ces données restent sur cet appareil ; rien n’est envoyé.' : 'Dans cet aperçu, l’appareil ne permet pas de conserver les données : elles seront perdues à la fermeture.'} N’inscrivez jamais l’identité d’un patient.</p></section>`
      + `<section class="card"><h2>À propos</h2><p class="about">${S.length} scores et règles de décision dans ${CATS.length} catégories, avec références. Contenu vérifié en octobre 2026. Outil d’aide à la décision à visée pédagogique : il ne remplace ni le jugement clinique ni les protocoles du service. Police Atkinson Hyperlegible Next (Braille Institute, licence OFL).</p></section>`;
  },
};

/* ---------- Formulaire ---------- */
function checkHtml(sc, it) {
  const showP = !sc.hidePts;
  const pl = it.pl ?? fmtP(it.p);
  return `<label class="opt check"><input type="checkbox" name="${it.id}"><span class="mark" aria-hidden="true"></span><span class="opt-l">${t(it.l)}${it.h ? `<small>${t(it.h)}</small>` : ''}</span>${showP ? `<span class="opt-p">${t(pl)}</span>` : ''}</label>`;
}
function head(it, showP, labelFor) {
  const lab = labelFor ? `<label for="i-${it.id}">${t(it.l)}</label>` : `<span id="l-${it.id}">${t(it.l)}</span>`;
  return `<div class="item-head">${lab}${showP ? `<span class="pts" data-pts="${it.id}">—</span>` : ''}</div>${it.h ? `<p class="help">${t(it.h)}</p>` : ''}`;
}
function radioHtml(sc, it) {
  const showP = !(sc.hidePts || it.nopts);
  return `<div class="item" data-it="${it.id}" role="radiogroup" aria-labelledby="l-${it.id}">${head(it, showP)}<div class="opts">${it.o.map((o, i) =>
    `<label class="opt"><input type="radio" name="${it.id}" value="${i}"><span class="mark" aria-hidden="true"></span><span class="opt-l">${t(o.l)}</span>${showP ? `<span class="opt-p">${o.nt ? 'NT' : fmtS(o.p)}</span>` : ''}</label>`).join('')}</div></div>`;
}
function segHtml(sc, it) {
  const showP = !sc.hidePts && it.o.some(o => 'p' in o);
  return `<div class="item" data-it="${it.id}" role="radiogroup" aria-labelledby="l-${it.id}">${head(it, showP)}<div class="seg">${it.o.map((o, i) =>
    `<label><input type="radio" name="${it.id}" value="${i}"${it.def === i ? ' checked' : ''}><span>${t(o.l)}</span></label>`).join('')}</div></div>`;
}
function numHtml(sc, it) {
  const showP = !!it.pf && !sc.hidePts;
  const unit = it.units
    ? `<span class="useg" role="radiogroup" aria-label="Unité de ${esc(it.l)}">${it.units.map((u, i) => `<label><input type="radio" name="u-${it.id}" value="${i}"${i === 0 ? ' checked' : ''}><span>${t(u.u)}</span></label>`).join('')}</span>`
    : it.u ? `<span class="unit">${t(it.u)}</span>` : '';
  const adders = it.adders ? `<div class="adders">${it.adders.map(a => `<button type="button" class="adder" data-target="${it.id}" data-add="${a.v}">${t(a.l)} <b>+${fmtS(a.v)}</b></button>`).join('')}<button type="button" class="adder clear" data-target="${it.id}" data-add="0">Effacer</button></div>` : '';
  const dv = it.dv != null && it.dv !== '' ? ` value="${String(it.dv).replace('.', ',')}"` : '';
  return `<div class="item" data-it="${it.id}">${head(it, showP, true)}<div class="num-row"><input id="i-${it.id}" name="${it.id}" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="next" placeholder="—" aria-describedby="e-${it.id}"${dv}>${unit}</div>${adders}<p class="err" id="e-${it.id}" hidden></p></div>`;
}
function scaleHtml(sc, it) {
  const n = it.max + 1;
  return `<div class="item" data-it="${it.id}" role="radiogroup" aria-labelledby="l-${it.id}">${head(it, true)}<div class="scale" style="--n:${it.cols || n}">${Array.from({ length: n }, (_, i) =>
    `<label><input type="radio" name="${it.id}" value="${i}" aria-label="${i}${it.a[i] ? ' : ' + esc(it.a[i]) : ''}"><span>${i}</span></label>`).join('')}</div><dl class="anchors">${Object.keys(it.a).map(k =>
    `<div data-k="${k}"><dt>${k}</dt><dd>${t(it.a[k])}</dd></div>`).join('')}</dl></div>`;
}
function itemsHtml(sc) {
  let h = '', group = [];
  const flush = () => { if (group.length) { h += `<div class="item"><div class="opts">${group.join('')}</div></div>`; group = []; } };
  for (const it of sc.items) {
    if (it.t === 'check') { group.push(checkHtml(sc, it)); continue; }
    flush();
    if (it.t === 'h') h += `<h3 class="sec">${t(it.l)}</h3>`;
    else if (it.t === 'radio') h += radioHtml(sc, it);
    else if (it.t === 'seg') h += segHtml(sc, it);
    else if (it.t === 'num') h += numHtml(sc, it);
    else if (it.t === 'scale') h += scaleHtml(sc, it);
  }
  flush();
  return h;
}

function readValues(sc) {
  const v = {};
  for (const it of sc.items) {
    if (!it.id) continue;
    if (it.t === 'check') v[it.id] = formEl.elements[it.id].checked;
    else if (it.t === 'num') {
      const inp = formEl.elements[it.id], err = $('#e-' + it.id, formEl);
      const raw = inp.value.trim().replace(/\s/g, '').replace(',', '.');
      let x = raw === '' ? null : Number(raw), bad = '';
      const ui = it.units ? +formEl.querySelector(`input[name="u-${it.id}"]:checked`).value : 0;
      const f = it.units ? it.units[ui].f : 1;
      if (it.units) v['_u_' + it.id] = ui;
      if (x != null) {
        if (!Number.isFinite(x)) bad = 'Saisir un nombre.';
        else {
          x *= f;
          if (x < it.min || x > it.max) {
            const u = it.units ? it.units[ui].u : (it.u || '');
            const lim = y => (+y.toPrecision(3)).toLocaleString('fr-FR', { maximumFractionDigits: 4 });
            bad = `Valeur hors des limites plausibles (${lim(it.min / f)} à ${lim(it.max / f)}${u ? ' ' + u : ''}).`;
          }
        }
      }
      inp.classList.toggle('bad', !!bad);
      inp.setAttribute('aria-invalid', bad ? 'true' : 'false');
      err.hidden = !bad; err.textContent = bad;
      v[it.id] = bad ? null : x;
    } else {
      const el = formEl.querySelector(`input[name="${it.id}"]:checked`);
      v[it.id] = el ? +el.value : null;
    }
  }
  return v;
}

function update(e) {
  /* ignore les événements tardifs d’un formulaire déjà remplacé */
  if (!cur || !formEl || (e && e.currentTarget !== formEl)) return;
  const v = readValues(cur);
  curV = v;
  for (const it of cur.items) {
    if (!it.id) continue;
    const b = formEl.querySelector(`[data-pts="${it.id}"]`);
    if (!b) continue;
    const p = itemPoints(it, v);
    const o = (it.t === 'radio' || it.t === 'seg') && v[it.id] != null ? it.o[v[it.id]] : null;
    b.textContent = o && o.nt ? 'NT' : p == null ? '—' : fmtS(p);
    b.classList.toggle('on', !!(p && p > 0));
  }
  for (const it of cur.items) if (it.show) { const box = formEl.querySelector(`[data-it="${it.id}"]`); if (box) box.hidden = !it.show(v); }
  formEl.querySelectorAll('.opt input').forEach(i => i.closest('.opt').classList.toggle('sel', i.checked));
  formEl.querySelectorAll('.scale').forEach(sc => {
    const chk = sc.querySelector('input:checked');
    sc.nextElementSibling.querySelectorAll('[data-k]').forEach(d => d.classList.toggle('cur', !!chk && d.dataset.k === chk.value));
  });
  let r = computeResult(cur, v);
  const checks = cur.items.filter(i => i.t === 'check' && !(i.show && !i.show(v)));
  if (!r.pending && checks.length && !checks.some(i => v[i.id]) && !noneOK) {
    /* résultat grave déjà établi par les autres champs : on l’affiche, avec un rappel */
    if (r.lvl === 'high' || r.lvl === 'crit') r = Object.assign({}, r, { confirm: true, lines: [...(r.lines || []), 'Aucune case cochée : vérifier que les autres critères sont bien absents.'] });
    else r = { pending: true, confirm: true, lvl: 'pending', value: '—', unit: '', title: 'Confirmer l’absence de critère', text: 'Aucune case n’est cochée. Cochez les critères présents ; si aucun ne l’est, confirmez-le.' };
  }
  renderResult(r);
}

/* Les boutons restent en place : seul le contenu change, et seulement s’il a changé,
   pour qu’un clic ne soit jamais perdu pendant un nouveau rendu. */
function renderResult(r) {
  const lvl = r.lvl || 'info';
  resEl.className = 'result lvl-' + lvl;
  const body = `<div class="res-top"><p class="res-val">${r.pre ? `<span class="res-pre">${t(r.pre)}</span>` : ''}${t(r.value ?? '—')}${r.unit ? `<span class="res-unit">${t(r.unit)}</span>` : ''}</p><p class="res-title">${t(r.title || '')}</p></div>`
    + (r.warn ? `<p class="res-warn">${t(r.warn)}</p>` : '')
    + (r.text ? `<p class="res-text">${t(r.text)}</p>` : '')
    + (r.lines && r.lines.length ? `<ul class="res-lines">${r.lines.map(l => `<li>${t(l)}</li>`).join('')}</ul>` : '')
    + (r.confirm ? '<p class="res-confirm"><button type="button" class="btn ghost" data-act="none">Aucun critère présent</button></p>' : '');
  if (body !== lastBody) { $('.res-body', resEl).innerHTML = body; lastBody = body; }
  $('[data-act="copy"]', resEl).disabled = !!r.pending;
  $('[data-act="save"]', resEl).disabled = !!r.pending;
  monEl.className = 'monitor lvl-' + lvl + (monOff ? ' off' : '');
  const mon = `${t(r.title || '')}\u0000${r.pre ? `<small class="pre">${t(r.pre)}</small>` : ''}${t(r.value ?? '—')}${r.unit && r.unit.length < 6 ? `<small>${t(r.unit)}</small>` : ''}`;
  if (mon !== lastMon) {
    const [ti, va] = mon.split('\u0000');
    $('.mon-title', monEl).innerHTML = ti; $('.mon-v', monEl).innerHTML = va; lastMon = mon;
  }
  const live = `${cur.name} : ${r.pre ? r.pre + ' ' : ''}${r.value ?? ''} ${r.unit ?? ''}, ${r.title || ''}`;
  if (live !== lastLive) { lastLive = live; liveEl.textContent = live; }
  curR = r;
}

function elementLines() {
  const sc = cur, v = curV, L = [];
  for (const it of sc.items) {
    if (!it.id) continue;
    if (it.show && !it.show(v)) continue;
    const val = v[it.id];
    if (it.t === 'check') { if (val) L.push(`${it.l}${sc.hidePts || !it.p ? '' : ` (${fmtP(it.p)})`}`); continue; }
    if (val == null) continue;
    if (it.t === 'num') {
      const inp = formEl.elements[it.id];
      const u = it.units ? it.units[+formEl.querySelector(`input[name="u-${it.id}"]:checked`).value].u : (it.u || '');
      const p = itemPoints(it, v);
      L.push(`${it.l} : ${inp.value.trim()}${u ? ' ' + u : ''}${p != null && !sc.hidePts ? ` (${fmtS(p)})` : ''}`);
    } else if (it.t === 'scale') L.push(`${it.l} : ${val}`);
    else {
      const o = it.o[val];
      const showP = !sc.hidePts && !it.nopts && 'p' in o;
      L.push(`${it.l} : ${o.l}${showP ? ` (${o.nt ? 'NT' : fmtS(o.p)})` : ''}`);
    }
  }
  return L.length ? L : ['Aucun critère présent'];
}
function summaryText() {
  const sc = cur, r = curR;
  const L = [`${sc.name} (${sc.full})`, `Résultat : ${r.pre ? r.pre + ' ' : ''}${r.value}${r.unit ? ' ' + r.unit : ''}, ${r.title}`];
  if (r.text) L.push(r.text);
  (r.lines || []).forEach(l => L.push('- ' + l));
  L.push('Éléments :');
  elementLines().forEach(l => L.push('- ' + l));
  const d = new Date();
  L.push(`Calculé le ${d.toLocaleDateString('fr-FR')} à ${d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}`);
  return L.join('\n');
}
async function copyText(txt) {
  try { await navigator.clipboard.writeText(txt); return true; } catch (e) { /* repli ci-dessous */ }
  const ta = document.createElement('textarea');
  ta.value = txt; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove(); return ok;
}
function saveResult() {
  const r = curR; if (!r || r.pending) return;
  hist.unshift({ id: cur.id, name: cur.name, value: (r.pre ? r.pre + ' ' : '') + r.value, unit: r.unit || '', title: r.title, text: r.text || '', lvl: r.lvl, items: elementLines(), date: new Date().toISOString() });
  hist = hist.slice(0, 100);
  store.set('scores-urg-hist', hist);
  toast('Résultat enregistré dans l’historique');
}

function openScore(id) {
  formEl = null;
  cur = byId[id];
  const sc = cur, on = favs.includes(id), cat = catOf(sc);
  recents = [id, ...recents.filter(x => x !== id)].slice(0, 8);
  store.set('scores-urg-recent', recents);
  bar({ title: sc.name, back: true, right: `<button type="button" class="icon-btn heart" data-fav="${id}" aria-pressed="${on}" aria-label="${on ? 'Retirer des' : 'Ajouter aux'} favoris">${heartSvg(on)}</button>` });
  viewEl.innerHTML = `<section class="intro" style="--c:${CC[sc.cat]}"><p class="chip"><i class="dot"></i>${t(cat.l)}</p><p class="intro-full">${t(sc.full)}</p><p class="intro-when"><b>Indication :</b> ${t(sc.when)}</p></section>
    <form id="f" novalidate autocomplete="off">${itemsHtml(sc)}</form>
    <section class="result" id="res" aria-label="Résultat"><div class="res-body"></div><div class="res-actions"><button type="button" class="btn" data-act="copy">Copier</button><button type="button" class="btn ghost" data-act="save">Enregistrer</button><button type="button" class="btn ghost" data-act="reset">Réinitialiser</button></div></section>
    ${sc.notes && sc.notes.length ? `<details open><summary>À savoir</summary><ul>${sc.notes.map(n => `<li>${t(n)}</li>`).join('')}</ul></details>` : ''}
    ${sc.refs && sc.refs.length ? `<details class="refs"><summary>Références</summary><ol>${sc.refs.map(n => `<li>${t(n)}</li>`).join('')}</ol></details>` : ''}
    <p class="disclaimer">Aide à la décision à visée pédagogique : ne remplace ni le jugement clinique ni les protocoles du service.</p>
    <div class="monitor" id="mon"><button type="button" class="mon-btn" aria-label="Voir l’interprétation détaillée"><span class="mon-bar" aria-hidden="true"></span><span class="mon-l"><span class="mon-name">${t(sc.name)}</span><span class="mon-title"></span></span><span class="mon-v"></span></button></div>`;
  formEl = $('#f', viewEl); resEl = $('#res', viewEl); monEl = $('#mon', viewEl);
  monOff = false; lastLive = ''; lastBody = ''; lastMon = '';
  formEl.addEventListener('input', update);
  formEl.addEventListener('change', update);
  formEl.addEventListener('submit', e => e.preventDefault());
  formEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.matches('input[type="text"]')) {
      e.preventDefault();
      const ins = [...formEl.querySelectorAll('input[type="text"]')];
      const nx = ins[ins.indexOf(e.target) + 1];
      if (nx) nx.focus(); else e.target.blur();
    }
  });
  formEl.addEventListener('click', e => {
    const a = e.target.closest('.adder'); if (!a) return;
    const inp = formEl.elements[a.dataset.target], add = +a.dataset.add;
    if (!add) inp.value = '';
    else inp.value = fmtS(Math.min(100, (Number(inp.value.trim().replace(',', '.')) || 0) + add)).replace(/ | /g, '');
    update();
  });
  resEl.addEventListener('click', async e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    if (b.dataset.act === 'copy') toast((await copyText(summaryText())) ? 'Résultat copié' : 'Copie impossible sur cet appareil');
    else if (b.dataset.act === 'save') saveResult();
    else if (b.dataset.act === 'none') {
      noneOK = true; update();
      const tEl = $('.res-title', resEl); if (tEl) { tEl.setAttribute('tabindex', '-1'); tEl.focus({ preventScroll: true }); }
    } else if (b.dataset.act === 'reset') {
      formEl.reset(); noneOK = false; update();
      window.scrollTo({ top: 0, behavior: reduceMotion() ? 'auto' : 'smooth' });
    }
  });
  monEl.addEventListener('click', () => resEl.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' }));
  if (io) io.disconnect();
  if ('IntersectionObserver' in window) {
    io = new IntersectionObserver(es => { for (const en of es) { monOff = en.isIntersecting; monEl.classList.toggle('off', monOff); } }, { threshold: 0.35 });
    io.observe(resEl);
  }
  noneOK = false;
  update();
}

/* ---------- Favoris, historique, préférences ---------- */
function toggleFav(id) {
  favs = favs.includes(id) ? favs.filter(x => x !== id) : [...favs, id];
  store.set('scores-urg-fav', favs);
  const on = favs.includes(id);
  document.querySelectorAll(`[data-fav="${id}"]`).forEach(b => { b.setAttribute('aria-pressed', on); b.innerHTML = heartSvg(on); });
  toast(on ? 'Ajouté aux favoris' : 'Retiré des favoris');
  if (shown === 'fav') rerender();
}
function armed(btn, fn) {
  /* effacement en deux temps, sans boîte de dialogue (bloquée dans certains aperçus) */
  if (btn.dataset.armed) { fn(); return; }
  btn.dataset.armed = '1'; const old = btn.textContent; btn.textContent = 'Confirmer';
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = old; } }, 3000);
}

/* ---------- Navigation ----------
   Pas de liens : dans un aperçu intégré, un lien « #… » quitte la page. L’état est tenu
   en mémoire ; l’adresse n’est mise à jour que si le document a une vraie URL. */
const canHistory = /^(https?|file):$/.test(location.protocol);
const parseHash = () => {
  const h = location.hash.replace(/^#\/?/, '');
  const m = h.match(/^s\/([\w-]+)/);
  if (m) return byId[m[1]] ? 's/' + m[1] : 'home';
  const c = h.match(/^cat\/([\w-]+)/);
  if (c) return CATS.some(x => x.id === c[1]) ? 'cat/' + c[1] : 'cats';
  return ['cats', 'all', 'fav', 'hist', 'set'].includes(h) ? h : 'home';
};
const PARENT = r => r.startsWith('cat/') ? 'cats' : 'home';
const scrollMem = {};
let shown;
function rerender() { const r = shown; shown = null; show(r, true); }
function show(route, keepScroll) {
  if (route === shown) return;
  if (shown && !shown.startsWith('s/')) scrollMem[shown] = window.scrollY;
  const [r, arg] = route.split('/');
  if (shown && shown.startsWith('s/')) { cur = null; formEl = null; if (io) { io.disconnect(); io = null; } }
  shown = route;
  document.body.classList.toggle('calc-mode', r === 's');
  renderTabs({ home: 'home', all: 'home', cats: 'cats', cat: 'cats', fav: 'fav', hist: 'hist', set: 'set' }[r] || '');
  if (r === 's') openScore(arg); else VIEWS[r](arg);
  window.scrollTo(0, keepScroll ? (scrollMem[route] || 0) : 0);
  const h = barEl.querySelector('h1'); if (h && r === 's') h.focus({ preventScroll: true });
}
function go(route) {
  if (route === shown) return;
  show(route);
  if (!canHistory) return;
  try { history.pushState({ app: true }, '', '#/' + route); } catch (e) { /* navigation interne seulement */ }
}
function back() {
  if (canHistory) { try { if (history.state && history.state.app) { history.back(); return; } } catch (e) { /* ignoré */ } }
  const p = PARENT(shown || 'home');
  show(p, true);
  if (canHistory) { try { history.replaceState(null, '', '#/' + p); } catch (e) { /* ignoré */ } }
}
window.addEventListener('popstate', () => show(parseHash(), true));
window.addEventListener('hashchange', () => show(parseHash(), true));
document.addEventListener('click', e => {
  const f = e.target.closest('[data-fav]'); if (f) { toggleFav(f.dataset.fav); return; }
  const o = e.target.closest('[data-open]'); if (o) { go('s/' + o.dataset.open); return; }
  const g = e.target.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
  if (e.target.closest('[data-back]')) { back(); return; }
  const d = e.target.closest('[data-del]');
  if (d) { hist.splice(+d.dataset.del, 1); store.set('scores-urg-hist', hist); rerender(); toast('Résultat supprimé'); return; }
  const c = e.target.closest('[data-clear]');
  if (c) {
    armed(c, () => {
      if (c.dataset.clear === 'hist') { hist = []; store.set('scores-urg-hist', hist); toast('Historique effacé'); }
      else { favs = []; recents = []; store.set('scores-urg-fav', favs); store.set('scores-urg-recent', recents); toast('Favoris et récents effacés'); }
      rerender();
    });
    return;
  }
  const p = e.target.closest('[data-pref]');
  if (p) { const [k, v] = p.dataset.pref.split(':'); prefs[k] = v; store.set('scores-urg-prefs', prefs); applyPrefs(); rerender(); }
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && !e.target.matches('input, textarea')) { const q = $('#q'); if (q) { e.preventDefault(); q.focus(); } }
});
show(parseHash());

/* accès pour les tests automatisés */
window.__scores = { S, byId, computeResult, sumCalc };
})();
</script>
